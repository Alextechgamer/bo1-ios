name: Verify iOS platform source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned DXVK headers and source
        run: |
          git clone --branch v2.6.1 --depth 1 https://github.com/doitsujin/dxvk.git vendor/dxvk
          git -C vendor/dxvk submodule update --init --depth 1 include/vulkan
      - name: Fetch the pinned native input interface
        run: |
          git init vendor/bo1-engine
          git -C vendor/bo1-engine remote add origin https://github.com/Zephelinn/BO1-Ascension-ARM64.git
          git -C vendor/bo1-engine fetch --depth 1 origin 3401a66355c07d6c590049c2f42b7635c9bf00ac
          git -C vendor/bo1-engine checkout --detach FETCH_HEAD
          python3 ios/input/apply_engine_input.py vendor/bo1-engine
          python3 ios/input/apply_engine_input.py vendor/bo1-engine
      - name: Test startup, display state and native input contracts
        run: python3 scripts/run_host_tests.py --sanitize address,undefined --engine-source vendor/bo1-engine
      - name: Test Steam file containment with sanitizers
        run: python3 scripts/test_steam_safe_files.py --sanitize address,undefined
      - name: Test real DXVK WSI interface and static loader
        run: python3 graphics/tests/run_wsi_tests.py vendor/dxvk
  steam-swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Steam selection, content verification and installation recovery
        run: python3 scripts/test_steam_selection_storage.py
  apple-sdk-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned DXVK source
        run: |
          git clone --branch v2.6.1 --depth 1 https://github.com/doitsujin/dxvk.git vendor/dxvk
          git -C vendor/dxvk submodule update --init --depth 1 include/vulkan
          python3 patches/dxvk/apply.py vendor/dxvk
      - name: Configure iOS 16 ARM64 platform libraries
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_TOOLCHAIN_FILE=cmake/ios.cmake
          -DBO1_BUILD_IOS_PLATFORM=ON -DBUILD_TESTING=OFF
          -DBO1_DXVK_SOURCE_DIR="$PWD/vendor/dxvk"
      - name: Compile UIKit, Steam client, Metal bridge and DXVK platform archives
        run: cmake --build build-ios --config Release -- CODE_SIGNING_ALLOWED=NO
  apple-native-link:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: brew install ninja glslang
      - name: Fetch the pinned native input and audio source
        run: |
          git init vendor/bo1-engine
          git -C vendor/bo1-engine remote add origin https://github.com/Zephelinn/BO1-Ascension-ARM64.git
          git -C vendor/bo1-engine fetch --depth 1 origin 3401a66355c07d6c590049c2f42b7635c9bf00ac
          git -C vendor/bo1-engine checkout --detach FETCH_HEAD
      - name: Fetch all pinned DXVK renderer dependencies
        run: |
          git clone --branch v2.6.1 --depth 1 https://github.com/doitsujin/dxvk.git vendor/dxvk
          git -C vendor/dxvk submodule update --init --recursive --depth 1
          python3 patches/dxvk/apply.py vendor/dxvk
      - name: Build pinned ARM64 CoreAudio and FFmpeg dependencies
        run: bash scripts/build_ios_deps.sh --jobs 3
      - name: Configure the native libraries and diagnostics app
        run: >-
          cmake -S . -B build-ios-native -G Xcode
          -DCMAKE_TOOLCHAIN_FILE=cmake/ios.cmake
          -DBO1_BUILD_IOS_AUDIO=ON -DBO1_BUILD_IOS_PLATFORM=ON
          -DBO1_BUILD_IOS_DXVK=ON -DBO1_BUILD_DIAGNOSTICS=ON -DBUILD_TESTING=OFF
          -DBO1_ENGINE_SOURCE_DIR="$PWD/vendor/bo1-engine"
          -DBO1_DXVK_SOURCE_DIR="$PWD/vendor/dxvk"
      - name: Compile and link the native libraries and diagnostics app
        run: cmake --build build-ios-native --config Release --parallel 3 -- CODE_SIGNING_ALLOWED=NO
      - name: Record device binary platform and dependencies
        run: |
          xcrun vtool -show-build build-ios-native/Release-iphoneos/bo1_audio_link_probe.app/bo1_audio_link_probe > build-ios-native/audio-platform.txt
          xcrun otool -L build-ios-native/Release-iphoneos/bo1_audio_link_probe.app/bo1_audio_link_probe > build-ios-native/audio-linkage.txt
          xcrun vtool -show-build build-ios-native/Release-iphoneos/bo1_dxvk_link_probe > build-ios-native/renderer-platform.txt
          xcrun otool -L build-ios-native/Release-iphoneos/bo1_dxvk_link_probe > build-ios-native/renderer-linkage.txt
          xcrun vtool -show-build build-ios-native/Release-iphoneos/BO1PortDiagnostics.app/BO1PortDiagnostics > build-ios-native/diagnostics-platform.txt
          xcrun otool -L build-ios-native/Release-iphoneos/BO1PortDiagnostics.app/BO1PortDiagnostics > build-ios-native/diagnostics-linkage.txt
      - name: Package the separately named unsigned diagnostics IPA
        run: python3 scripts/package_diagnostics.py --app build-ios-native/Release-iphoneos/BO1PortDiagnostics.app
      - uses: actions/upload-artifact@v4
        with:
          name: BO1-Port-Diagnostics-Unsigned
          path: |
            dist/BO1-Port-Diagnostics-Unsigned.ipa
            dist/BO1-Port-Diagnostics-Unsigned.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ios-native-build-evidence
          path: |
            third_party/ios/audio-build.json
            build-ios-native/*-platform.txt
            build-ios-native/*-linkage.txt
      - name: Retain native objects, archives and link metadata
        uses: actions/upload-artifact@v4
        with:
          name: BO1-Diagnostics-Link-Inputs
          path: |
            build-ios-native/**/*.o
            build-ios-native/**/*.LinkFileList
            build-ios-native/Release-iphoneos/*.a
            build-ios-native/BO1IOSPlatform.xcodeproj/project.pbxproj
            third_party/ios/SDL2-ios/lib/*.a
            third_party/ios/SDL2-ios/include/
            third_party/ios/ffmpeg-ios/lib/*.a
            third_party/ios/ffmpeg-ios/include/
            third_party/ios/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a
            third_party/ios/MoltenVK/include/
            third_party/ios/*.json
            THIRD_PARTY_NOTICES.md
            graphics/DXVK-LICENSE
            vendor/sdl2/LICENSE.txt
            vendor/ffmpeg/LICENSE.md
            vendor/ffmpeg/COPYING.LGPLv2.1
            third_party/ios/MoltenVK/LICENSE
            ios/SteamAuth/COPYING
            ios/SteamAuth/LICENSE-EXCEPTION.md
            ios/SteamAuth/UPSTREAM.md
            ios/SteamAuth/IMPORT.json
            ios/SteamServices/Content/ZSTD-LICENSE
            build-ios-native/**/*.swiftmodule
            build-ios-native/**/*.swiftdoc
          if-no-files-found: error
# This IPA runs platform diagnostics; it contains no game engine or game assets.
# Game packaging follows a real linked engine/HUD/renderer adapter and ABI proof.
